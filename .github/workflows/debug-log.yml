name: debug-log

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "sdk.dir=$SDK" > xd/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build (capture log)
        run: |
          set +e
          gradle -p xd --no-daemon assembleRelease > build.log 2>&1
          echo "exit=$?"
          grep -E '^(e: |w: file)|error:|What went wrong|Execution failed|Could not|Unresolved|AAPT|aapt' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -60 > errs.txt
          if [ ! -s errs.txt ]; then tail -40 build.log > errs.txt; fi
          split -l 10 -d errs.txt chunk_
          for f in chunk_*; do
            MSG=$(awk '{printf "%s%%0A", $0}' "$f" | cut -c1-3500)
            echo "::error title=build-log $f::$MSG"
          done
